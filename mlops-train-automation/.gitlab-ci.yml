stages: [train]

variables:
  AWS_DEFAULT_REGION: "eu-central-1"   # override in CI settings if needed
  # Option A (classic keys): set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitLab CI variables
  # Option B (OIDC): set AWS_ROLE_ARN and configure OpenID Connect in your AWS account

train-model:
  stage: train
  image: amazon/aws-cli:2.15.0
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'push'"
  before_script:
    # If using OIDC, assume role. Otherwise, skip and rely on access keys.
    - |
      if [ -n "$AWS_ROLE_ARN" ]; then
        echo "Using OIDC to assume role: $AWS_ROLE_ARN"
        CREDS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ROLE_ARN" \
          --role-session-name "gitlab-ci-$CI_COMMIT_SHORT_SHA" \
          --web-identity-token "$CI_JOB_JWT" \
          --duration-seconds 3600)
        export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)
        export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)
        export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)
      else
        echo "Using long-lived keys from CI variables"
      fi
  script:
    - test -n "$SFN_ARN" || { echo "SFN_ARN variable is required"; exit 1; }
    - aws stepfunctions start-execution \
        --state-machine-arn "$SFN_ARN" \
        --name "train-$(date +%s)" \
        --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"

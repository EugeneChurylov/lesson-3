stages:
  - test
  - train
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements.txt || true

# ------------- tests -------------
unit-tests:
  stage: test
  script:
    - echo "No tests yet; add pytest later"
    - python -c "print('smoke ok')"

# ------------- retrain -------------
retrain-model:
  stage: train
  script:
    - echo "Start retrain"
    - python model/train.py
    - ls -lh model/
  artifacts:
    when: always
    paths:
      - model/model.pkl
    expire_in: 7 days

# ------------- deploy / trigger -------------
# ВАРІАНТ А: якщо хочеш викликати AWS Step Functions (опційно)
deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: manual
  script:
    - pip install --no-cache-dir awscli==1.32.0
    - echo "region=$AWS_DEFAULT_REGION sfn=$SFN_ARN sha=$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$SFN_ARN" ]; then
        aws stepfunctions start-execution \
          --region "$AWS_DEFAULT_REGION" \
          --state-machine-arn "$SFN_ARN" \
          --name "train-$(date +%s)" \
          --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"
      else
        echo "SFN_ARN is empty -> skipping AWS Step Functions trigger"
      fi


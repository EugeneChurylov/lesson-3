stages:
  - train

variables:
  AWS_DEFAULT_REGION: eu-central-1

train-model:
  stage: train
  image: python:3.12-slim
  before_script:
    - python --version
    - pip install --no-cache-dir awscli==1.32.0
    - aws --version
    - echo "region=$AWS_DEFAULT_REGION sfn=$SFN_ARN sha=$CI_COMMIT_SHORT_SHA"
  script:
    - aws stepfunctions start-execution --region "$AWS_DEFAULT_REGION" --state-machine-arn "$SFN_ARN" --name "train-$(date +%s)" --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"

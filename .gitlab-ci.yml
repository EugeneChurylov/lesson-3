stages:
  - retrain
  - build
  - deploy

retrain:
  stage: retrain
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - python --version
    - pip install --no-cache-dir -r requirements.txt
  script:
    - echo "Start retrain"
    - python model/train.py
    - test -f model/model.pkl
  artifacts:
    name: "model-${CI_COMMIT_SHORT_SHA}"
    paths:
      - model/model.pkl
    expire_in: 1 week

build_image:
  stage: build
  image: docker:24.0.9
  services:
    - name: docker:24.0.9-dind
      command: ["--tls=false"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    IMAGE_LATEST_TAG: "latest"
  needs: ["retrain"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_REGISTRY_IMAGE'
      when: on_success
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:$IMAGE_LATEST_TAG" .
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_LATEST_TAG"
  dependencies:
    - retrain

deploy:
  stage: deploy
  image:
    name: alpine/helm:3.14.2
    entrypoint: [""]
  needs:
    - job: build_image
      optional: true
    - job: retrain
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $KUBE_CONFIG_B64 && $HELM_RELEASE && $HELM_NAMESPACE'
      when: on_success
    - when: never
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config
    - kubectl version --client
    - helm version
  script:
    - export VALUES_PATH="${HELM_VALUES:-helm/values.yaml}"
    - |
      set -e
      echo "Deploying $HELM_RELEASE into $HELM_NAMESPACE using $VALUES_PATH"
      helm upgrade --install "$HELM_RELEASE" ./helm \
        --namespace "$HELM_NAMESPACE" --create-namespace \
        -f "$VALUES_PATH" \
        ${CI_REGISTRY_IMAGE:+--set image.repository=$CI_REGISTRY_IMAGE} \
        ${CI_COMMIT_SHORT_SHA:+--set image.tag=$CI_COMMIT_SHORT_SHA}
    - kubectl -n "$HELM_NAMESPACE" get pods

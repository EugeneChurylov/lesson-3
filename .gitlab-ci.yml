stages:
  - train

variables:
  AWS_DEFAULT_REGION: eu-central-1

train-model:
  stage: train
  image: amazon/aws-cli:2.15.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - echo "PWD=$(pwd)"
    - ls -la
    - echo "--- cat -A ci/train.sh ---"
    - cat -A ci/train.sh
    - echo "--- running with /bin/sh -x ---"
    - /bin/sh -x ci/train.sh
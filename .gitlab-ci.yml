stages:
  - train

variables:
  AWS_DEFAULT_REGION: "eu-central-1"

train-model:
  stage: train
  image: amazon/aws-cli:2.15.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - set -ex
    - aws --version
    - aws configure list
    - aws sts get-caller-identity
    - aws --region "$AWS_DEFAULT_REGION" stepfunctions help | head -n 10
    - aws --region "$AWS_DEFAULT_REGION" stepfunctions start-execution \
        --state-machine-arn "$SFN_ARN" \
        --name "train-$(date +%s)" \
        --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"
